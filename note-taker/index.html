<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteFlow | Notes</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app-shell">
      <!-- Header -->
      <header class="topbar">
        <a class="brand" href="#">
          <span class="brand-mark">✦</span>
          <span>NoteFlow</span>
        </a>

        <p id="note-count" class="note-count">Your little thought space</p>
      </header>

      <!-- Intro section -->
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">PERSONAL NOTES</p>
          <h1 id="page-title">Make room for<br /><em>good ideas.</em></h1>
        </div>

        <button id="new-note-btn" class="new-note-btn" type="button">
          <span>+</span> New note
        </button>
      </section>

      <!-- Search and pinned filter -->
      <section class="tools" aria-label="Note tools">
        <label class="search-box" for="search-input">
          <span aria-hidden="true">⌕</span>
          <input
            id="search-input"
            type="search"
            placeholder="Search your notes..."
          />
        </label>

        <button id="show-pinned-btn" class="filter-btn" type="button">
          Pinned only
        </button>
      </section>

      <!-- Notes will be created here by JavaScript -->
      <section id="notes-container" class="notes-grid" aria-live="polite">
        <!-- Sample notes: remove these after you build displayNotes() in JavaScript. -->
        
      </section>

      <!-- Shown by JavaScript when no notes match -->
      <p id="empty-message" class="empty-message" hidden>
        No notes found. Create one!
      </p>
    </main>

    <!-- New note popup -->
    <dialog id="note-dialog" class="note-dialog">
      <form id="note-form" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">NEW THOUGHT</p>
            <h2>Add a note</h2>
          </div>

          <button
            id="close-dialog-btn"
            class="close-btn"
            type="button"
            aria-label="Close"
          >
            ×
          </button>
        </div>

        <label for="note-title">Title</label>
        <input
          id="note-title"
          name="title"
          type="text"
          maxlength="40"
          placeholder="Give it a short title"
          required
        />

        <label for="note-text">Note</label>
        <textarea
          id="note-text"
          name="text"
          rows="5"
          maxlength="240"
          placeholder="What's on your mind?"
          required
        ></textarea>

        <label class="pin-option" for="pin-note">
          <input id="pin-note" type="checkbox" />
          Pin this note to the top
        </label>

        <button class="save-btn" type="submit">Save note</button>
      </form>
    </dialog>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
